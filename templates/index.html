<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAC Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ===== Top Bar ===== -->
    <nav class="topbar">
        <div class="topbar-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="3"/>
                <line x1="12" y1="2" x2="12" y2="5"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
            <span>FLAC Library</span>
        </div>
        <div class="topbar-stats" id="topbar-stats"></div>
        <div style="display:flex; align-items:center; gap:0.75rem;">
            <a href="/sql_commands" style="display:inline-flex; align-items:center; gap:0.4rem; color:var(--gold); text-decoration:none; font-size:0.85rem; font-weight:600; padding:0.4rem 0.8rem; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-md); transition:0.2s;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                SQL Studio / Console
            </a>
        </div>
    </nav>

    <!-- ===== Stats Row ===== -->
    <section class="stats-row" id="stats-row"></section>

    <!-- ===== Controls ===== -->
    <section class="controls">
        <div class="search-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search" placeholder="Search across all metadata...">
        </div>
        <div class="control-group">
            <select id="sort-by">
                <option value="artist">Sort: Artist</option>
                <option value="title">Sort: Title</option>
                <option value="album">Sort: Album</option>
                <option value="release_year">Sort: Year</option>
                <option value="duration">Sort: Duration</option>
                <option value="bit_depth">Sort: Bit Depth</option>
                <option value="sample_rate">Sort: Sample Rate</option>
                <option value="bitrate">Sort: Bitrate</option>
                <option value="file_size">Sort: File Size</option>
                <option value="play_count">Sort: Plays</option>
                <option value="rating">Sort: Rating</option>
                <option value="genre">Sort: Genre</option>
            </select>
            <button id="sort-dir" class="btn-icon" title="Toggle sort direction">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
            </button>
        </div>
        <div class="control-group filters" id="quality-filters">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="24bit">24-bit</button>
            <button class="chip" data-filter="hires">Hi-Res</button>
            <button class="chip" data-filter="cd">CD Quality</button>
        </div>
        <div class="result-count" id="result-count"></div>
    </section>

    <!-- ===== Song List ===== -->
    <main class="song-list" id="song-list">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading your library...</p>
        </div>
    </main>

    <!-- ===== Bottom Audiophile Audio Player Bar ===== -->
    <div class="player-bar" id="player-bar">
        <div class="player-track">
            <div class="player-art-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </div>
            <div class="player-info">
                <div class="player-title" id="player-title">Select a track to play</div>
                <div class="player-sub" id="player-sub">—</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="player-buttons">
                <button class="player-btn" id="btn-prev" title="Previous Track" onclick="playPrevTrack()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
                </button>
                <button class="player-btn-main" id="btn-play-pause" title="Play / Pause (Spacebar)" onclick="togglePlayPause()">
                    <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
                <button class="player-btn" id="btn-next" title="Next Track" onclick="playNextTrack()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
                </button>
            </div>
            <div class="progress-bar-container">
                <span class="time-stamp" id="curr-time">0:00</span>
                <input type="range" class="progress-slider" id="progress-bar" value="0" min="0" max="100" step="0.1" oninput="seekTrack(this.value)">
                <span class="time-stamp" id="total-time">0:00</span>
            </div>
        </div>

        <div class="player-options">
            <button class="astra-launch-btn" id="btn-open-astra" title="Open and playback directly in Astra app" onclick="launchInAstra()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                Open in Astra.exe
            </button>
            <div class="volume-control">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <input type="range" class="volume-slider" id="volume-bar" value="100" min="0" max="100" oninput="setVolume(this.value)">
            </div>
        </div>
    </div>

    <audio id="audio-engine" preload="auto"></audio>
    <script src="/static/app.js"></script>
</body>
</html>
